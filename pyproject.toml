[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-analysis-agent"
version = "0.2.0"
description = "AI-powered multi-agent stock analysis and forecasting system with technical indicators and sector correlation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Stock Analysis Team"}
]
keywords = [
    "stock-analysis",
    "ai-agents",
    "langchain",
    "forecasting",
    "technical-analysis",
    "machine-learning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # LangChain Core - Pin to avoid breaking changes
    "langchain~=0.3.0",
    "langchain-core~=0.3.0",
    "langgraph~=0.2.0",
    "langchain-google-genai~=2.0.0",

    # Vector Database
    "chromadb~=0.5.0",

    # Stock Data & Web Scraping
    "yfinance~=0.2.40",
    "beautifulsoup4~=4.12.0",
    "requests~=2.32.0",
    "lxml~=5.2.0",

    # Data Processing
    "pandas~=2.2.0",
    "numpy>=1.26.0,<2.0.0",

    # NLP and Embeddings
    "sentence-transformers~=3.0.0",
    "nltk~=3.9.0",

    # Configuration
    "python-dotenv~=1.0.0",

    # Data Validation
    "pydantic~=2.10.0",
    "pydantic-settings~=2.6.0",
    "python-dateutil~=2.9.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest~=8.3.0",
    "pytest-cov~=6.0.0",
    "pytest-asyncio~=0.24.0",
    "pytest-mock~=3.14.0",
    "pytest-xdist~=3.6.0",

    # Code Quality
    "ruff~=0.8.0",
    "mypy~=1.13.0",
    "pre-commit~=4.0.0",

    # Type Stubs
    "types-requests~=2.32.0",
    "types-beautifulsoup4~=4.12.0",
    "types-python-dateutil~=2.9.0",
    "pandas-stubs~=2.2.0",

    # Documentation
    "mkdocs~=1.6.0",
    "mkdocs-material~=9.5.0",
]

monitoring = [
    # Observability
    "langsmith~=0.1.0",
    "opentelemetry-api~=1.27.0",
    "opentelemetry-sdk~=1.27.0",
    "structlog~=24.4.0",
]

[project.urls]
Homepage = "https://github.com/WeiyingZhao/single_stock_analysis_agent"
Repository = "https://github.com/WeiyingZhao/single_stock_analysis_agent"
Issues = "https://github.com/WeiyingZhao/single_stock_analysis_agent/issues"

[project.scripts]
stock-analyze = "main:main"
stock-init = "initialize_db:main"

# ============================================================================
# RUFF - Modern Python Linter & Formatter (replaces black, isort, flake8)
# Docs: https://docs.astral.sh/ruff/
# ============================================================================
[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4

# Exclude common directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
    "chroma_db",
]

[tool.ruff.lint]
# Enable recommended rules + additional checks
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "PIE",    # flake8-pie
    "PYI",    # flake8-pyi
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # pylint
    "TRY",    # tryceratops
    "RUF",    # ruff-specific rules
]

ignore = [
    "E501",    # Line too long (handled by formatter)
    "PLR0913", # Too many arguments (common in ML/AI code)
    "PLR2004", # Magic value comparisons (common in thresholds)
    "TRY003",  # Long exception messages (prefer descriptive errors)
    "B008",    # Function call in defaults (common in FastAPI/Pydantic)
]

# Allow autofix for all enabled rules (when `--fix` is provided)
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports (common in __init__ files)
"tests/**/*.py" = [
    "PLR2004",  # Magic values in tests are fine
    "S101",     # Assert statements in tests are expected
    "ARG",      # Unused arguments in fixtures
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["agents", "models", "tools", "utils", "config"]
force-single-line = false
lines-after-imports = 2

# ============================================================================
# MYPY - Static Type Checker
# Docs: https://mypy.readthedocs.io/
# ============================================================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Gradual typing - start lenient
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
no_implicit_optional = true
show_error_codes = true
show_column_numbers = true
pretty = true

# Be lenient with third-party libraries initially
ignore_missing_imports = true

# Exclude these directories
exclude = [
    "^chroma_db/",
    "^build/",
    "^dist/",
]

# Per-module options (gradually increase strictness)
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

# ============================================================================
# PYTEST - Testing Framework
# Docs: https://docs.pytest.org/
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=0",  # Start at 0%, increase over time
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "llm: marks tests that call actual LLM APIs (expensive)",
]

# ============================================================================
# COVERAGE - Code Coverage Reporting
# Docs: https://coverage.readthedocs.io/
# ============================================================================
[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "*/test_*.py",
    "*_test.py",
    "*/conftest.py",
    ".venv/*",
    "venv/*",
    "*/site-packages/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@overload",
]

[tool.coverage.html]
directory = "htmlcov"
